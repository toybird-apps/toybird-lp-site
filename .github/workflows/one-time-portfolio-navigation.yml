name: One-time portfolio navigation sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-portfolio-navigation.yml

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Portfolio navigation across Blog hubs and articles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          hub_paths = {
              Path('blog/index.html'),
              Path('en/blog/index.html'),
              Path('de/blog/index.html'),
              Path('fr/blog/index.html'),
              Path('es/blog/index.html'),
              Path('it/blog/index.html'),
              Path('pt-br/blog/index.html'),
              Path('ko/blog/index.html'),
              Path('zh-cn/blog/index.html'),
              Path('zh-tw/blog/index.html'),
          }

          changed = []
          hub_changed = 0
          article_changed = 0

          for path in sorted(hub_paths):
              if not path.exists():
                  raise SystemExit(f'Missing expected Blog hub: {path}')
              text = path.read_text(encoding='utf-8')
              pattern = r'(<header class="hub-header">.*?<nav><a href="https://lp\.toybird\.com/">)(.*?)(</a>)'
              new_text, count = re.subn(pattern, r'\1Portfolio\3', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not update Portfolio link in Blog hub: {path}')
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))
                  hub_changed += 1

          for path in sorted(root.glob('**/blog/**/index.html')):
              if path in hub_paths:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'class="global-header"' not in text:
                  continue
              if '<a href="https://lp.toybird.com/">Portfolio</a>' in text:
                  continue
              pattern = r'(<header class="global-header">.*?<nav>)'
              new_text, count = re.subn(pattern, r'\1<a href="https://lp.toybird.com/">Portfolio</a>', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not add Portfolio link to article header: {path}')
              path.write_text(new_text, encoding='utf-8')
              changed.append(str(path))
              article_changed += 1

          print(f'BLOG_NAV_SUMMARY hubs={hub_changed} articles={article_changed} total={len(changed)}')
          for path in changed:
              print('UPDATED', path)

          if hub_changed != 10:
              raise SystemExit(f'Expected 10 Blog hubs to change, got {hub_changed}')
          if article_changed == 0:
              raise SystemExit('No article headers were changed')
          PY

      - name: Commit navigation updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Toybird Labs'
          git config user.email 'tb.masaki@gmail.com'
          git add blog en/blog de/blog fr/blog es/blog it/blog pt-br/blog ko/blog zh-cn/blog zh-tw/blog
          git commit -m 'Connect Blog navigation to Portfolio'
          git push
