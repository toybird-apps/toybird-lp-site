          for path, want in expected.items():
              url='https://lp.toybird.com/'+urllib.parse.quote(path, safe='/')+'?verify=20260904-0120'
              req=urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Toybird-Public-Deploy-Check/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read(); status=r.status
                  got=hashlib.sha256(data).hexdigest()
                  ok=status==200 and got==want
                  print(('PASS' if ok else 'FAIL'), status, path, got)
                  if not ok: failures.append((path,status,want,got))
              except Exception as e:
                  print('ERROR', path, repr(e)); failures.append((path,'error',want,repr(e)))
          print(f'PUBLIC_VERIFY_SUMMARY passed={len(expected)-len(failures)} total={len(expected)} failed={len(failures)}')
          if failures:
              for x in failures: print('MISMATCH', x)
              raise SystemExit(1)
