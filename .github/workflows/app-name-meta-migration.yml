name: Temporary AI Study Sheet LP migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-name-meta-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified 56-file patch
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, json, zlib

          payload = ""
          patch = json.loads(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          changed = []

          for rel, spec in patch.items():
              path = Path(rel)
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest == spec["post"]:
                  print(f"Already at target: {rel}")
                  continue
              if digest != spec["pre"]:
                  raise SystemExit(f"Preimage SHA-256 mismatch for {rel}: {digest}")

              text = raw.decode("utf-8")
              for start, end, replacement in reversed(spec["edits"]):
                  text = text[:start] + replacement + text[end:]
              out = text.encode("utf-8")
              post = hashlib.sha256(out).hexdigest()
              if post != spec["post"]:
                  raise SystemExit(f"Postimage SHA-256 mismatch for {rel}: {post}")
              path.write_bytes(out)
              changed.append(rel)
              print(f"Updated: {rel}")

          expected = set(patch)
          if set(changed) != expected:
              already = expected - set(changed)
              if already:
                  print(f"{len(already)} file(s) were already at target state")

          Path('.github/workflows/app-name-meta-migration.yml').unlink()
          PYCODE

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "Toybird Labs"
          git config user.email "tb.masaki@gmail.com"
          git add -A
          echo "Staged paths:"
          git diff --cached --name-only
          git commit -m "Update AI Study Sheet naming and Bing meta descriptions"
          git push origin HEAD:main

      - name: Notify IndexNow after deployment delay
        shell: bash
        run: |
          sleep 90
          python3 - <<'PYCODE'
          import json, urllib.request

          key = "7a3b4046a5384da2a36d59297c7b7650"
          base = "https://lp.toybird.com/"
          urls = []
          import base64, zlib
          payload = ""
          patch = json.loads(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          for rel in patch:
              if rel == "index.html":
                  urls.append(base)
              elif rel.endswith("/index.html"):
                  urls.append(base + rel[:-len("index.html")])
          urls = sorted(set(urls))
          body = json.dumps({
              "host": "lp.toybird.com",
              "key": key,
              "keyLocation": f"{base}{key}.txt",
              "urlList": urls,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              method="POST",
              headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "Toybird-Labs-IndexNow/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print("IndexNow response:", response.status, response.read().decode("utf-8", "replace"))
          print("Submitted URLs:", len(urls))
          PYCODE
