name: Temp GCP credential availability
on:
  push:
    branches: [chatgpt-gcp-tts-20261102]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      TOP_SALES_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.TOP_SALES_GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
    steps:
      - name: Report availability only
        shell: bash
        run: |
          for n in GCP_SA_KEY GOOGLE_CREDENTIALS_JSON GOOGLE_APPLICATION_CREDENTIALS_JSON TOP_SALES_GOOGLE_APPLICATION_CREDENTIALS_JSON GCP_SERVICE_ACCOUNT_KEY; do
            if [ -n "${!n:-}" ]; then echo "HAS_${n}=yes"; else echo "HAS_${n}=no"; fi
          done
