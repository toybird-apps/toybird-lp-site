name: One-time Google indexing structure cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seo-structure-20260906.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply site structure and content cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The new homepage and the two small consolidation pages were pre-created
          # as repository blobs so this one-time workflow can apply them atomically.
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/56225cc6d56a056d8986608e788e71e92ef209da --jq .content | tr -d '\n' | base64 --decode > index.html
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/49f087938cc791d5a0f2844e90cc9d7f6a45459d --jq .content | tr -d '\n' | base64 --decode > blog/mac-floating-window-reference/index.html
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/ac9d77402d0b6c944e78bfe19803a0670de704c3 --jq .content | tr -d '\n' | base64 --decode > blog/mac-highlight-active-window/index.html

          python3 - <<'PY'
          from pathlib import Path
          import json, re
          import xml.etree.ElementTree as ET

          # --- Japanese blog hub ---
          p = Path('blog/index.html')
          s = p.read_text(encoding='utf-8')
          old_desc = '生成AIの使い方、Macの画面共有・作業効率、手元の教材を使った暗記などを、Toybird Labsでの実機確認と公式資料をもとに整理します。'
          new_desc = 'アプリを作ったり使ったりする中で実際にぶつかった疑問を、試したことと公式資料で確認できたことを分けながら書いています。Macの作業、画面共有、生成AI、学習の実用メモです。'
          s = s.replace(old_desc, new_desc)
          old_intro = '<p>生成AIの使い方、Macの画面共有・作業効率、手元の教材を使った暗記などを、Toybird Labsでの実機確認と公式資料をもとに整理します。</p><p>実機で確認した内容と、公式資料で確認した事実を区別して掲載しています。</p>'
          new_intro = '<p>アプリを作ったり使ったりする中で、実際に「これ、どうするのが一番いいだろう」と迷ったことを起点に書いています。</p><p>Macの1画面作業、画面共有、ChatGPTへの頼み方、手元の教材を使った復習など。自分たちで試したことと、公式資料で確認できた仕様は分けて扱います。</p>'
          s = s.replace(old_intro, new_intro)
          nav_marker = '<nav><a href="https://labs.toybird.com/">Toybird Labs</a>'
          if nav_marker in s and '<nav><a href="https://lp.toybird.com/">Home</a>' not in s:
              s = s.replace(nav_marker, '<nav><a href="https://lp.toybird.com/">Home</a><a href="https://labs.toybird.com/">Toybird Labs</a>', 1)

          remove_urls = {
              'https://lp.toybird.com/blog/mac-floating-window-reference/',
              'https://lp.toybird.com/blog/mac-highlight-active-window/'
          }
          for url in remove_urls:
              s = re.sub(r'<a class="hub-card" href="' + re.escape(url) + r'">.*?</a>', '', s, count=1, flags=re.S)

          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Japanese blog JSON-LD not found')
          data = json.loads(m.group(1))
          for node in data.get('@graph', []):
              if node.get('@type') == 'Blog':
                  node['description'] = new_desc
              if node.get('@type') == 'ItemList':
                  keep = [item for item in node.get('itemListElement', []) if item.get('url') not in remove_urls]
                  for i, item in enumerate(keep, 1):
                      item['position'] = i
                  node['itemListElement'] = keep
          replacement = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '</script>'
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')

          # --- English blog hub ---
          p = Path('en/blog/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Practical guides from building and testing small tools for work, Mac workflows, presentations and study'
          new = 'Practical notes from questions we run into while building and using our apps: one-screen Mac work, screen sharing, clearer AI requests, and studying from your own material.'
          s = s.replace(old, new)
          old_intro = '<p>Practical guides from building and testing small tools for work, Mac workflows, presentations and study</p><p>Tests on our own products are kept separate from facts taken from official sources</p>'
          new_intro = '<p>We write about questions that come up while building and using our apps: keeping a reference visible on one MacBook screen, making a screen share easier to follow, writing a useful AI request, or reviewing material you already have.</p><p>When something comes from our own testing, we say so. When it depends on an OS or service specification, we check the official documentation.</p>'
          s = s.replace(old_intro, new_intro)
          if nav_marker in s and '<nav><a href="https://lp.toybird.com/">Home</a>' not in s:
              s = s.replace(nav_marker, '<nav><a href="https://lp.toybird.com/">Home</a><a href="https://labs.toybird.com/">Toybird Labs</a>', 1)
          p.write_text(s, encoding='utf-8')

          # --- French blog hub (one of the GSC validation failures) ---
          p = Path('fr/blog/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Des guides pratiques issus du développement et des tests de petits outils pour le travail, le Mac, la présentation et l’étude'
          new = 'Des notes pratiques nées de questions rencontrées en développant et en utilisant nos apps : travail sur un seul écran Mac, partage d’écran, demandes plus claires à l’IA et révision à partir de ses propres supports.'
          s = s.replace(old, new)
          old_intro = '<p>Des guides pratiques issus du développement et des tests de petits outils pour le travail, le Mac, la présentation et l’étude</p><p>Les essais réalisés sur nos produits sont distingués des informations provenant de sources officielles</p>'
          new_intro = '<p>Nous partons de questions rencontrées en développant et en utilisant nos apps : garder un document visible sur un MacBook, rendre un partage d’écran plus facile à suivre, formuler une demande utile à une IA ou réviser à partir de ses propres supports.</p><p>Quand une observation vient de nos propres essais, nous le précisons. Quand elle dépend d’une spécification du système ou d’un service, nous vérifions la documentation officielle.</p>'
          s = s.replace(old_intro, new_intro)
          if nav_marker in s and '<nav><a href="https://lp.toybird.com/">Home</a>' not in s:
              s = s.replace(nav_marker, '<nav><a href="https://lp.toybird.com/">Home</a><a href="https://labs.toybird.com/">Toybird Labs</a>', 1)
          p.write_text(s, encoding='utf-8')

          # --- Sitemap ---
          sm = Path('sitemap.xml')
          tree = ET.parse(sm)
          root = tree.getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          existing = []
          remove_urls = {
              'https://lp.toybird.com/blog/mac-floating-window-reference/',
              'https://lp.toybird.com/blog/mac-highlight-active-window/'
          }
          changed_hubs = {
              'https://lp.toybird.com/blog/',
              'https://lp.toybird.com/en/blog/',
              'https://lp.toybird.com/fr/blog/'
          }
          for u in list(root.findall(ns + 'url')):
              loc = u.find(ns + 'loc').text
              if loc in remove_urls:
                  root.remove(u)
                  continue
              existing.append(loc)
              if loc in changed_hubs:
                  lm = u.find(ns + 'lastmod')
                  if lm is None:
                      lm = ET.SubElement(u, ns + 'lastmod')
                  lm.text = '2026-09-06'
          if 'https://lp.toybird.com/' not in existing:
              u = ET.Element(ns + 'url')
              ET.SubElement(u, ns + 'loc').text = 'https://lp.toybird.com/'
              ET.SubElement(u, ns + 'lastmod').text = '2026-09-06'
              root.insert(0, u)
          ET.register_namespace('', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          tree.write(sm, encoding='utf-8', xml_declaration=True)

          # Sanity checks before committing.
          homepage = Path('index.html').read_text(encoding='utf-8')
          assert 'name="robots" content="index,follow' in homepage
          assert '<link rel="canonical" href="https://lp.toybird.com/">' in homepage
          assert 'https://lp.toybird.com/en/blog/' in homepage
          for path, target in [
              ('blog/mac-floating-window-reference/index.html', 'https://lp.toybird.com/blog/mac-view-reference-while-working/'),
              ('blog/mac-highlight-active-window/index.html', 'https://lp.toybird.com/blog/screen-sharing-show-where-to-look/')
          ]:
              text = Path(path).read_text(encoding='utf-8')
              assert 'noindex,follow' in text and target in text
          xml = Path('sitemap.xml').read_text(encoding='utf-8')
          assert '<loc>https://lp.toybird.com/</loc>' in xml
          assert '<loc>https://lp.toybird.com/blog/mac-floating-window-reference/</loc>' not in xml
          assert '<loc>https://lp.toybird.com/blog/mac-highlight-active-window/</loc>' not in xml
          PY

          # Remove this helper so the final site contains no maintenance artifact.
          rm .github/workflows/seo-structure-20260906.yml

      - name: Commit applied changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Toybird Labs"
          git config user.email "tb.masaki@gmail.com"
          git add -A
          git commit -m "Strengthen LP site structure for Google indexing"
          git push origin HEAD:main
