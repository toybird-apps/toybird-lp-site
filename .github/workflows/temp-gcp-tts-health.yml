name: Temp GCP TTS health check
on:
  push:
    branches: [chatgpt-gcp-tts-20261102]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing Japanese renderer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "https://top-sales-renderer-923694534263.asia-northeast1.run.app/health" \
            | tee health.json
      - uses: actions/upload-artifact@v4
        with:
          name: temp-gcp-health
          path: health.json
