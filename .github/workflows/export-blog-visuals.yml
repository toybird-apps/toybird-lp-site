name: Export public site for editorial review

# Audit helper: exports every public HTML page plus the visual assets affected by the editorial cleanup.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-blog-visuals.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect public-site audit material
        run: |
          mkdir -p review-material
          git -c core.quotepath=false ls-files > review-material/__repo_files.txt

          find . -type f -name '*.html' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            | while read -r f; do
                mkdir -p "review-material/$(dirname "$f")"
                cp "$f" "review-material/$f"
              done

          for f in sitemap.xml robots.txt CNAME; do
            if [ -f "$f" ]; then
              cp "$f" "review-material/$f"
            fi
          done

          find shared/ai-study-sheet-v3 -maxdepth 1 -type f \( -name 'article-*.png' -o -name '*-overview.png' \) \
            | while read -r f; do
                mkdir -p "review-material/$(dirname "$f")"
                cp "$f" "review-material/$f"
              done

          find blog en/blog de/blog fr/blog es/blog it/blog pt-br/blog ko/blog zh-cn/blog zh-tw/blog \
            -type f \( -name '*-og.png' -o -name '*-og.jpg' \) 2>/dev/null \
            | while read -r f; do
                mkdir -p "review-material/$(dirname "$f")"
                cp "$f" "review-material/$f"
              done

          find review-material -type f | sort

      - name: Upload review material
        uses: actions/upload-artifact@v4
        with:
          name: public-site-audit
          path: review-material
          if-no-files-found: error
