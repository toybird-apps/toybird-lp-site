name: Export blog visuals for editorial review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-blog-visuals.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect all blog hero and OG images
        run: |
          mkdir -p review-images
          find . -type f \( -iname '*-og.png' -o -iname '*-og.jpg' -o -path './shared/blog-visuals/*' \) \
            | while read -r f; do
                mkdir -p "review-images/$(dirname "$f")"
                cp "$f" "review-images/$f"
              done
          find review-images -type f | sort

      - name: Upload review images
        uses: actions/upload-artifact@v4
        with:
          name: blog-visuals-review-all
          path: review-images
          if-no-files-found: error
