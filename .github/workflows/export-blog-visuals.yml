name: Export blog visuals for editorial review

# Audit helper: collects all localized blog HTML and OG visuals after the Korean canonical repair.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-blog-visuals.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect multilingual blog audit material
        run: |
          mkdir -p review-material
          find . -type f \( -iname '*-og.png' -o -iname '*-og.jpg' -o -path './shared/blog-visuals/*' -o -path './shared/ai-study-sheet-v3/*' -o -name 'index.html' \) \
            | while read -r f; do
                case "$f" in
                  ./blog/*|./en/blog/*|./de/blog/*|./fr/blog/*|./es/blog/*|./it/blog/*|./pt-br/blog/*|./ko/blog/*|./zh-cn/blog/*|./zh-tw/blog/*|./shared/blog-visuals/*|./shared/ai-study-sheet-v3/*)
                    mkdir -p "review-material/$(dirname "$f")"
                    cp "$f" "review-material/$f"
                    ;;
                esac
              done
          find review-material -type f | sort

      - name: Upload review material
        uses: actions/upload-artifact@v4
        with:
          name: blog-audit-all-locales
          path: review-material
          if-no-files-found: error
