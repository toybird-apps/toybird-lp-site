name: Blog108 verify live release
on:
  push:
    branches: [blog108-production-20260917]
    paths: [.github/workflows/blog108-verify-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 34fcbed4411d902b718b9ffdb6d1e97dbc49efa6
          fetch-depth: 2
          persist-credentials: false
      - name: Verify public HTML, CSS, JavaScript, image and sitemap
        run: |
          python - <<'PY'
          import subprocess,pathlib,urllib.request,urllib.parse,hashlib,json,time,concurrent.futures,datetime,os
          base='ba2f0da0bb207bca5fa5c9ac1ba70614305d339f'
          target='34fcbed4411d902b718b9ffdb6d1e97dbc49efa6'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==target
          paths=subprocess.check_output(['git','diff','--name-only','-z',base,target]).decode().strip('\0').split('\0')
          assert len(paths)==112 and sum(p.endswith('/index.html') for p in paths)==108
          def check(path):
              url='https://lp.toybird.com/'+urllib.parse.quote(path.removesuffix('index.html') if path.endswith('/index.html') else path,safe='/')
              expected=hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              result={'path':path,'url':url,'expected_sha256':expected,'success':False}
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Toybird-release-verification/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=25) as response:
                          content=response.read();actual=hashlib.sha256(content).hexdigest()
                          result.update(status=response.status,actual_sha256=actual,bytes=len(content),final_url=response.geturl(),attempt=attempt+1)
                          if response.status==200 and actual==expected:
                              result['success']=True;return result
                  except Exception as exc:
                      result['error']=str(exc)
                  if attempt<3:time.sleep(15)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(check,paths))
          failed=[r for r in results if not r['success']]
          report={'commit':target,'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pages':108,'total_files':len(paths),'passed':len(paths)-len(failed),'failed':failed,'results':results}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'blog108-live';out.mkdir()
          (out/'live-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='results'},ensure_ascii=False,indent=2))
          if failed:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blog108-live-verification
          path: ${{ runner.temp }}/blog108-live
          retention-days: 7
