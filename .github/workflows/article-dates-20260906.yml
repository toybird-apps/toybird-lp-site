name: One-time article modified-date sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/article-dates-20260906.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync modified dates on revised articles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pages = {
            'blog/chatgpt-prompt-work-tips/index.html': ('更新: 2026-08-24', '更新: 2026-09-06'),
            'blog/mac-view-reference-while-working/index.html': ('更新: 2026-08-24', '更新: 2026-09-06'),
            'blog/screen-sharing-show-where-to-look/index.html': ('更新: 2026-08-24', '更新: 2026-09-06'),
            'en/blog/chatgpt-prompt-work-tips/index.html': ('Updated: 2026-08-24', 'Updated: 2026-09-06'),
          }
          for path, (visible_old, visible_new) in pages.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              required = [
                '2026-08-24T10:00:00+09:00',
                '"dateModified":"2026-08-24"',
                visible_old,
                'datetime="2026-08-24"'
              ]
              for needle in required:
                  if needle not in s:
                      raise SystemExit(f'Missing {needle} in {path}')
              s = s.replace('2026-08-24T10:00:00+09:00', '2026-09-06T17:00:00+09:00', 1)
              s = s.replace('"dateModified":"2026-08-24"', '"dateModified":"2026-09-06"', 1)
              s = s.replace('datetime="2026-08-24"', 'datetime="2026-09-06"', 1)
              s = s.replace(visible_old, visible_new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/article-dates-20260906.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Toybird Labs"
          git config user.email "tb.masaki@gmail.com"
          git add -A
          git commit -m "Sync modified dates for revised guides"
          git push origin HEAD:main
