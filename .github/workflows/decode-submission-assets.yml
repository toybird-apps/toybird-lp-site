name: Decode submission assets

on:
  push:
    branches: [main]
    paths:
      - 'en/pocket-screen/submission-assets/.decode-ready'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Pocket Screen submission assets
        shell: bash
        run: |
          set -euo pipefail
          dir='en/pocket-screen/submission-assets'
          shopt -s nullglob

          for f in "$dir"/*.b64; do
            out="${f%.b64}"
            base64 --decode "$f" > "$out"
            rm "$f"
          done

          bases=$(find "$dir" -maxdepth 1 -type f -name '*.b64.part-*' -printf '%f\n' | sed -E 's/\.part-[0-9]+$//' | sort -u || true)
          while IFS= read -r base; do
            [ -z "$base" ] && continue
            cat "$dir/$base".part-* > "$dir/$base"
            out="$dir/${base%.b64}"
            base64 --decode "$dir/$base" > "$out"
            rm "$dir/$base" "$dir/$base".part-*
          done <<< "$bases"

          if [ -f "$dir/submission-assets.tar.gz" ]; then
            tar -xzf "$dir/submission-assets.tar.gz" -C "$dir"
            rm "$dir/submission-assets.tar.gz"
          fi

          rm -f "$dir/.decode-ready" \
                "$dir/.keep" \
                "$dir/DO-NOT-USE.txt" \
                "$dir/README-upload-note.txt" \
                "$dir/README-PENDING.txt" \
                "$dir/STATUS.txt" \
                "$dir/test.txt" \
                "$dir/NOTICE.txt" \
                "$dir/icon.svg"
      - name: Commit decoded assets
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/pocket-screen/submission-assets
          git commit -m 'Publish Pocket Screen submission image assets [skip assets-decode]'
          git push
