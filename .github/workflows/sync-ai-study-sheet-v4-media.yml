name: Sync AI Study Sheet v4 public assets

on:
  push:
    branches: [main]
    paths: ['scripts/sync_ai_study_sheet_v4_media.py']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check 'pillow>=10,<13'
      - name: Fetch production App Store 4.0.0 media
        run: python3 scripts/sync_ai_study_sheet_v4_media.py
      - name: Publish localized screenshots and OG images
        run: |
          git config user.name "Toybird Labs Automation"
          git config user.email "actions@users.noreply.github.com"
          git add shared/ai-study-sheet-v4/
          if ! git diff --cached --quiet; then
            git commit -m "Add localized AI Study Sheet v4 App Store media"
            git push origin HEAD:main
          fi
