name: Blog108 official source check
on:
  push:
    branches: [blog108-production-20260917]
    paths: [.github/workflows/blog108-source-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official public statutory source
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json
          lawid='337AC0000000139'
          url='https://laws.e-gov.go.jp/api/1/lawdata/'+lawid
          req=urllib.request.Request(url,headers={'User-Agent':'Toybird-editorial-source-verification/1.0'})
          raw=urllib.request.urlopen(req,timeout=60).read()
          root=ET.fromstring(raw)
          matches=[x for x in root.iter('Article') if x.get('Num')=='3']
          if not matches:
              raise RuntimeError('Official law source did not contain Article 3')
          print('SOURCE',url)
          print('LAW', ''.join(root.find('.//LawTitle').itertext()))
          for x in matches:
              print('ARTICLE 3:', ''.join(x.itertext()))
          print('Verification source retrieval complete; no site files modified.')
          PY
