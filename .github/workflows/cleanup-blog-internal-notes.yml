name: Clean multilingual blog editorial boilerplate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup_blog_internal_notes.py'
      - 'scripts/fix_blog_audit_findings.py'
      - '.github/workflows/cleanup-blog-internal-notes.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove internal-facing blog copy across all locales
        run: python3 scripts/cleanup_blog_internal_notes.py

      - name: Apply blog audit fixes
        run: python3 scripts/fix_blog_audit_findings.py

      - name: Validate change scope
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ['git', '-c', 'core.quotepath=false', 'diff', '--name-only'],
              text=True,
          ).splitlines()
          if not changed:
              raise SystemExit('Cleanup produced no changes.')

          unexpected = []
          for name in changed:
              p = Path(name)
              parts = p.parts
              is_blog_html = p.suffix == '.html' and 'blog' in parts
              if not is_blog_html:
                  unexpected.append(name)
          if unexpected:
              raise SystemExit(f'Unexpected files changed: {unexpected}')
          print(f'Validated {len(changed)} changed blog HTML files.')
          PY

      - name: Check generated HTML diff
        run: git diff --check

      - name: Commit production cleanup
        run: |
          git config user.name "Toybird Labs Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git commit -m "Fix multilingual blog audit findings"
          git push origin HEAD:main
