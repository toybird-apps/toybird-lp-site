name: One-time priority content quality pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/content-quality-20260906.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Humanize priority pages and connect all language hubs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def replace_required(path, old, new, count=0):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n == 0:
                  raise SystemExit(f'Missing expected text in {path}: {old[:80]}')
              if count:
                  s = s.replace(old, new, count)
              else:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              return n

          # 1) Japanese ChatGPT pillar: less generic, more concrete language.
          ja_prompt_old = 'ChatGPTを仕事で使うための指示（プロンプト）のコツを、返信メール・会議メモの具体例と10の活用例で解説。目的・条件・出力形式の伝え方が分かります。'
          ja_prompt_new = '仕事でChatGPTを使うとき、長いプロンプトを書くより先に揃えたいのは、作業・元資料・目的・条件・出力形式です。顧客返信と会議メモを例に、実務での使い方を整理します。'
          replace_required('blog/chatgpt-prompt-work-tips/index.html', ja_prompt_old, ja_prompt_new)
          replace_required('blog/chatgpt-prompt-work-tips/index.html', '<h2>この記事で分かること</h2>', '<h2>長いプロンプトより、先に揃えたい5つの材料</h2>', 1)
          replace_required('blog/chatgpt-prompt-work-tips/index.html', '仕事で使うプロンプトは、長さより「判断材料」を揃える', '仕事の依頼は、まず5つの材料を揃える')
          replace_required('blog/chatgpt-prompt-work-tips/index.html', '仕事の依頼では、長い説明を書くことより、ChatGPTが判断に使う情報を抜けなく渡す方が重要です。最初は次の5項目だけで十分です。', '仕事でChatGPTを使っていて困るのは、プロンプトが短いことより、前提が抜けたまま文章だけきれいに完成してしまうことです。顧客返信でも会議メモでも、最初に次の5項目を渡すだけで、修正の回数を減らしやすくなります。')

          # 2) Japanese one-screen Mac pillar: make the article's distinct use case obvious.
          ja_mac_old = 'MacBook 1台の1画面でPDFやWeb資料を見ながら快適に作業する方法を解説。タイル表示、Split View、Stage Manager、小窓表示を比較し、ウインドウ切り替えを減らす実践手順を紹介します。'
          ja_mac_new = 'MacBookの1画面でPDFやWebを見ながら入力するとき、Split View・Stage Manager・小窓のどれが使いやすいか。入力画面を広く残したい場面を中心に、配置と使い分けを整理します。'
          replace_required('blog/mac-view-reference-while-working/index.html', ja_mac_old, ja_mac_new)
          replace_required('blog/mac-view-reference-while-working/index.html', '<h2>この記事で分かること</h2>', '<h2>まず決めるのは、主作業をどれだけ広く残すか</h2>', 1)
          replace_required('blog/mac-view-reference-while-working/index.html', 'なぜ 1画面 では「切り替え」が負担になるのか', '一瞬のCommand+Tabより、その後の「探し直し」が重い')

          # 3) Japanese screen-sharing pillar: distinguish point/range/window instead of generic how-to copy.
          ja_share_old = '画面共有で「右上を見てください」だけでは伝わらない問題を改善。点はポインター、範囲は枠、現在のアプリはウインドウ強調を使い分け、説明を追いやすくする方法を紹介します。'
          ja_share_new = '画面共有で迷うのは、「右上です」と言われても場所を見つけるまでに一拍かかる瞬間です。小さなボタンはポインター、設定のまとまりは枠、アプリ切替はウインドウ強調と、対象の大きさで使い分けます。'
          replace_required('blog/screen-sharing-show-where-to-look/index.html', ja_share_old, ja_share_new)
          replace_required('blog/screen-sharing-show-where-to-look/index.html', '<h2>この記事で分かること</h2>', '<h2>「点・範囲・ウインドウ」で考えると迷わない</h2>', 1)
          replace_required('blog/screen-sharing-show-where-to-look/index.html', '点・範囲・ウインドウを同じ方法で示すと伝わりにくい', '「右上です」だけでは、意外と伝わらない')

          # 4) English ChatGPT page that appeared in the failed GSC sample.
          en_prompt_old = 'Learn how to use ChatGPT at work with five practical prompting habits, two detailed examples and ten tasks you can try immediately.'
          en_prompt_new = 'When ChatGPT is used for real work, the usual problem is missing context rather than a prompt that is too short. A customer reply and meeting notes show what to provide, what to leave unknown, and what to check before sending.'
          replace_required('en/blog/chatgpt-prompt-work-tips/index.html', en_prompt_old, en_prompt_new)
          replace_required('en/blog/chatgpt-prompt-work-tips/index.html', '<h2>What this guide will help you do</h2>', '<h2>Start with the information the model actually needs</h2>', 1)

          # Keep the hub cards consistent with the revised page descriptions.
          replace_required('blog/index.html', ja_prompt_old, ja_prompt_new)
          replace_required('blog/index.html', ja_mac_old, ja_mac_new)
          replace_required('blog/index.html', ja_share_old, ja_share_new)
          replace_required('en/blog/index.html', 'Learn how to use ChatGPT at work with five practical prompting habits, two detailed examples and ten tasks you can try immediately.', en_prompt_new)

          # 5) Every language blog hub now has a direct, crawlable path back to the new root hub.
          labels = {
              'blog/index.html': 'ホーム',
              'en/blog/index.html': 'Home',
              'de/blog/index.html': 'Startseite',
              'fr/blog/index.html': 'Accueil',
              'es/blog/index.html': 'Inicio',
              'it/blog/index.html': 'Home',
              'pt-br/blog/index.html': 'Início',
              'ko/blog/index.html': '홈',
              'zh-cn/blog/index.html': '首页',
              'zh-tw/blog/index.html': '首頁',
          }
          for path, label in labels.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              # Normalize the three hubs touched in phase 1, then add to the rest.
              s = s.replace('<nav><a href="https://lp.toybird.com/">Home</a>', f'<nav><a href="https://lp.toybird.com/">{label}</a>', 1)
              if 'href="https://lp.toybird.com/"' not in s:
                  marker = '<nav><a href="https://labs.toybird.com/">'
                  if marker not in s:
                      raise SystemExit(f'Nav marker missing in {path}')
                  s = s.replace('<nav>', f'<nav><a href="https://lp.toybird.com/">{label}</a>', 1)
              p.write_text(s, encoding='utf-8')

          # 6) Accurate lastmod values only for files changed in this pass.
          changed_urls = {
              'https://lp.toybird.com/blog/',
              'https://lp.toybird.com/en/blog/',
              'https://lp.toybird.com/de/blog/',
              'https://lp.toybird.com/fr/blog/',
              'https://lp.toybird.com/es/blog/',
              'https://lp.toybird.com/it/blog/',
              'https://lp.toybird.com/pt-br/blog/',
              'https://lp.toybird.com/ko/blog/',
              'https://lp.toybird.com/zh-cn/blog/',
              'https://lp.toybird.com/zh-tw/blog/',
              'https://lp.toybird.com/blog/chatgpt-prompt-work-tips/',
              'https://lp.toybird.com/blog/mac-view-reference-while-working/',
              'https://lp.toybird.com/blog/screen-sharing-show-where-to-look/',
              'https://lp.toybird.com/en/blog/chatgpt-prompt-work-tips/',
          }
          sm = Path('sitemap.xml')
          tree = ET.parse(sm)
          root = tree.getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          seen = set()
          for u in root.findall(ns + 'url'):
              loc = u.find(ns + 'loc').text
              if loc in changed_urls:
                  seen.add(loc)
                  lm = u.find(ns + 'lastmod')
                  if lm is None:
                      lm = ET.SubElement(u, ns + 'lastmod')
                  lm.text = '2026-09-06'
          missing = changed_urls - seen
          if missing:
              raise SystemExit('Changed URLs missing from sitemap: ' + ', '.join(sorted(missing)))
          ET.register_namespace('', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          tree.write(sm, encoding='utf-8', xml_declaration=True)

          # Basic guardrails.
          for path in labels:
              text = Path(path).read_text(encoding='utf-8')
              assert 'href="https://lp.toybird.com/"' in text
          assert ja_prompt_new in Path('blog/chatgpt-prompt-work-tips/index.html').read_text(encoding='utf-8')
          assert ja_mac_new in Path('blog/mac-view-reference-while-working/index.html').read_text(encoding='utf-8')
          assert ja_share_new in Path('blog/screen-sharing-show-where-to-look/index.html').read_text(encoding='utf-8')
          assert en_prompt_new in Path('en/blog/chatgpt-prompt-work-tips/index.html').read_text(encoding='utf-8')
          PY

          rm .github/workflows/content-quality-20260906.yml

      - name: Commit applied change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Toybird Labs"
          git config user.email "tb.masaki@gmail.com"
          git add -A
          git commit -m "Humanize priority guides and connect blog hubs"
          git push origin HEAD:main
